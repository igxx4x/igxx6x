<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>شاشة الحارس</title>
</head>
<body class="bg-slate-50 min-h-screen" style="font-family:'Tajawal',sans-serif">
  <header class="bg-white p-4 shadow-sm flex justify-between items-center">
    <div><h1 id="bName" class="font-bold">...</h1><p id="gName" class="text-sm text-slate-500"></p></div>
    <button onclick="logout()" class="border rounded-xl px-3 py-1 text-sm">خروج</button>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-5">
    <div class="grid grid-cols-2 gap-3">
      <button id="rMaint" class="bg-white rounded-2xl p-4 shadow-sm text-orange-700 font-medium active:scale-95 transition"><span class="text-2xl block">🔧</span>طلب صيانة عاجلة</button>
      <button id="rWater" class="bg-white rounded-2xl p-4 shadow-sm text-blue-700 font-medium active:scale-95 transition"><span class="text-2xl block">💧</span>طلب تعبئة مياه</button>
    </div>
    <div>
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold">شقق العمارة</h2>
        <button id="addApt" class="border rounded-xl px-3 py-1 text-sm bg-blue-50 text-blue-800">+ شقة</button>
      </div>
      <div id="list" class="space-y-3"><p class="text-sm text-slate-500">جاري التحميل...</p></div>
    </div>
  </main>

  <div id="tModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5">
      <h3 id="tTitle" class="font-bold mb-4"></h3>
      <input id="tName" type="text" placeholder="اسم المستأجر" class="w-full border rounded-xl p-3 mb-3 text-sm">
      <input id="tPhone" type="tel" placeholder="رقم الجوال (9665xxxxxxxx)" class="w-full border rounded-xl p-3 mb-3 text-sm" dir="ltr">
      <label class="text-xs text-slate-500">تاريخ بداية العقد</label>
      <input id="tStart" type="date" class="w-full border rounded-xl p-3 mb-3 text-sm" dir="ltr">
      <label class="text-xs text-slate-500">مدة العقد</label>
      <div id="months" class="grid grid-cols-4 gap-2 mt-1 mb-2"></div>
      <p id="endInfo" class="text-xs text-slate-500 mb-3"></p>
      <p id="tErr" class="text-red-600 text-sm mb-3 hidden"></p>
      <div class="flex gap-2">
        <button id="tSave" class="flex-1 bg-blue-600 text-white rounded-xl p-3 font-medium">حفظ</button>
        <button id="tCancel" class="flex-1 border rounded-xl p-3">إلغاء</button>
      </div>
    </div>
  </div>

  <div id="aModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5">
      <h3 id="aTitle" class="font-bold mb-4"></h3>
      <input id="aUnit" type="text" placeholder="رقم الشقة" class="w-full border rounded-xl p-3 mb-3 text-sm">
      <input id="aFloor" type="number" placeholder="الدور (اختياري)" class="w-full border rounded-xl p-3 mb-3 text-sm">
      <p id="aErr" class="text-red-600 text-sm mb-3 hidden"></p>
      <div class="flex gap-2">
        <button id="aSave" class="flex-1 bg-blue-600 text-white rounded-xl p-3 font-medium">حفظ</button>
        <button id="aCancel" class="flex-1 border rounded-xl p-3">إلغاء</button>
      </div>
    </div>
  </div>
  <script src="supabase.js"></script>
  <script src="common.js"></script>
  <script>
    let userId, buildingId, aptId = null, editApt = null, dur = 12;
    const el = id => document.getElementById(id);
    const show = id => el(id).classList.remove('hidden');
    const hide = id => el(id).classList.add('hidden');
    const fail = (id, m) => { el(id).textContent = m; show(id); };

    async function load() {
      const { data, error } = await db.from('apartments')
        .select('id, unit_number, floor, status, tenants(full_name, is_active)')
        .eq('building_id', buildingId).order('unit_number');
      const box = el('list');
      if (error) { console.log(error); box.innerHTML = '<p class="text-red-600 text-sm">تعذّر التحميل</p>'; return; }
      if (!data.length) { box.innerHTML = '<p class="text-sm text-slate-500">ما فيه شقق. اضغط + شقة.</p>'; return; }
      data.sort((a, b) => String(a.unit_number).localeCompare(String(b.unit_number), 'ar', { numeric: true }));
      box.innerHTML = '';
      data.forEach(a => {
        const vacant = a.status === 'vacant';
        const t = (a.tenants || []).find(x => x.is_active);
        const c = document.createElement('div');
        c.className = 'bg-white rounded-2xl p-4 shadow-sm';
        c.innerHTML = '<div class="flex justify-between items-center"><div><p class="font-medium">شقة ' + esc(a.unit_number) +
          '</p><p class="text-sm text-slate-500">الدور ' + (a.floor ?? '-') + '</p></div><span class="text-xs px-3 py-1 rounded-lg ' +
          (vacant ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700') + '">' + (vacant ? 'فارغة' : 'مؤجرة') + '</span></div>' +
          (!vacant && t ? '<p class="text-sm text-slate-600 mt-2">المستأجر: ' + esc(t.full_name) + '</p>' : '');
        const row = document.createElement('div');
        row.className = 'mt-3 flex gap-2';
        const mk = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'rounded-xl p-2 text-sm ' + cls; b.textContent = label; b.onclick = fn; row.appendChild(b); };
        if (vacant) mk('+ إضافة مستأجر جديد', 'flex-1 bg-blue-600 text-white', () => openTenant(a));
        else mk('إتاحة الشقة / إخلاء', 'flex-1 border border-red-300 text-red-700', () => vacate(a));
        mk('تعديل', 'border', () => openApt(a));
        c.appendChild(row);
        box.appendChild(c);
      });
    }

    async function vacate(a) {
      if (!confirm('تأكيد إخلاء شقة ' + a.unit_number + '؟')) return;
      let r = await db.from('tenants').update({ is_active: false }).eq('apartment_id', a.id).eq('is_active', true);
      if (r.error) { console.log(r.error); return toast('تعذّر إنهاء العقد'); }
      r = await db.from('apartments').update({ status: 'vacant' }).eq('id', a.id);
      if (r.error) { console.log(r.error); return toast('تعذّر تحديث الشقة'); }
      await db.from('requests').insert({ building_id: buildingId, type: 'vacated', note: 'تم إخلاء شقة ' + a.unit_number, created_by: userId });
      load();
    }

    function updateEnd() {
      const s = el('tStart').value;
      el('endInfo').textContent = s ? 'ينتهي العقد في: ' + addMonths(s, dur) : '';
      [...el('months').children].forEach(b => {
        b.className = 'border rounded-xl p-2 text-sm ' + (Number(b.dataset.m) === dur ? 'bg-blue-600 text-white border-blue-600' : '');
      });
    }

    function openTenant(a) {
      aptId = a.id; dur = 12;
      el('tTitle').textContent = 'مستأجر جديد - شقة ' + a.unit_number;
      el('tName').value = ''; el('tPhone').value = ''; el('tStart').value = today();
      hide('tErr'); updateEnd(); show('tModal');
    }

    [3, 6, 9, 12].forEach(m => {
      const b = document.createElement('button');
      b.dataset.m = m; b.textContent = m + ' شهر';
      b.onclick = () => { dur = m; updateEnd(); };
      el('months').appendChild(b);
    });
    el('tStart').onchange = updateEnd;
    el('tCancel').onclick = () => hide('tModal');

    el('tSave').onclick = async () => {
      const name = el('tName').value.trim(), phone = el('tPhone').value.trim(), start = el('tStart').value;
      if (!name || !phone || !start) return fail('tErr', 'عبّ كل الحقول');
      el('tSave').disabled = true;
      let r = await db.from('tenants').insert({
        apartment_id: aptId, full_name: name, phone, start_date: start,
        end_date: addMonths(start, dur), next_payment_date: addMonths(start, 1), created_by: userId
      });
      if (!r.error) r = await db.from('apartments').update({ status: 'rented' }).eq('id', aptId);
      el('tSave').disabled = false;
      if (r.error) { console.log(r.error); return fail('tErr', 'تعذّر الحفظ'); }
      hide('tModal'); load();
    };

    function openApt(a) {
      editApt = a;
      el('aTitle').textContent = a ? 'تعديل شقة ' + a.unit_number : 'شقة جديدة';
      el('aUnit').value = a ? a.unit_number : '';
      el('aFloor').value = a && a.floor != null ? a.floor : '';
      hide('aErr'); show('aModal');
    }
    el('addApt').onclick = () => openApt(null);
    el('aCancel').onclick = () => hide('aModal');

    el('aSave').onclick = async () => {
      const unit = el('aUnit').value.trim(), f = el('aFloor').value;
      if (!unit) return fail('aErr', 'اكتب رقم الشقة');
      const row = { unit_number: unit, floor: f === '' ? null : parseInt(f, 10) };
      const { error } = editApt
        ? await db.from('apartments').update(row).eq('id', editApt.id)
        : await db.from('apartments').insert({ ...row, building_id: buildingId });
      if (error) { console.log(error); return fail('aErr', error.code === '23505' ? 'رقم الشقة موجود في العمارة' : 'تعذّر الحفظ'); }
      hide('aModal'); load();
    };

    async function sendReq(type, label, btn) {
      if (!confirm('إرسال: ' + label + '؟')) return;
      btn.disabled = true;
      const { error } = await db.from('requests').insert({ building_id: buildingId, type, note: label, created_by: userId });
      btn.disabled = false;
      toast(error ? 'تعذّر إرسال الطلب' : 'تم إرسال الطلب للمدير');
      if (error) console.log(error);
    }
    el('rMaint').onclick = () => sendReq('maintenance', 'طلب صيانة عاجلة', el('rMaint'));
    el('rWater').onclick = () => sendReq('water', 'طلب تعبئة مياه', el('rWater'));

    (async () => {
      const auth = await requireRole('guard');
      if (!auth) return;
      userId = auth.userId; buildingId = auth.profile.building_id;
      el('gName').textContent = 'أهلاً يا ' + auth.profile.full_name;
      const { data } = await db.from('buildings').select('name').eq('id', buildingId).single();
      el('bName').textContent = data ? data.name : '';
      load();
    })();
  </script>
</body>
</html>
